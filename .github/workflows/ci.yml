name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Toolchain & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pip-audit pytest pytest-cov
          # Install makelib package if pyproject.toml defines buildable package
          pip install -e .

      - name: Run Ruff Lint Checks
        run: make lint

      - name: Run Mypy Strict Type Checks
        run: make type-check

      - name: Run Code Smell & Bandit Security AST Scans
        run: make smell

      - name: Run pip-audit CVE Dependency Checks
        run: make audit

      - name: Run Pytest & Enforce Coverage Threshold
        run: make test MIN_COVERAGE=80

  ci-success:
    name: CI Check Status
    needs: quality-gate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix checks passed
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ]; then
            echo "CI pipeline failed! See quality-gate job logs."
            exit 1
          fi
          echo "All quality gates passed successfully."
