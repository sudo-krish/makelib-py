name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional override, e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: "pip"

      - name: Install Toolchain & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pip-audit detect-secrets pip-licenses pytest pytest-cov build
          pip install -e .

      - name: Run Full Quality Gate Suite
        run: make check-all MIN_COVERAGE=80

  publish-release:
    name: Build & Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build

      - name: Determine Release Tag
        id: tagger
        run: |
          # 1. If manually provided via workflow_dispatch
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          # 2. If triggered by git tag push
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          # 3. If triggered by push/merge to main branch
          else
            PROJECT_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            BASE_TAG="v${PROJECT_VER}"
            if git rev-parse "${BASE_TAG}" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-parse "${BASE_TAG}^{commit}" 2>/dev/null || echo "")
              CURRENT_COMMIT=$(git rev-parse HEAD)
              if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
                TAG="${BASE_TAG}"
              else
                TAG="${BASE_TAG}-rev.${{ github.run_number }}"
              fi
            else
              TAG="${BASE_TAG}"
            fi
          fi

          echo "Determined release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Tag commit in git if tag does not exist yet
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Automated release $TAG from main"
            git push origin "$TAG"
          fi

      - name: Build Source and Wheel Distributions
        run: |
          python -m build

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Attach Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ steps.tagger.outputs.tag }}
