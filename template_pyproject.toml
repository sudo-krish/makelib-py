[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-service"
version = "0.1.0"
description = "Downstream Python service powered by makelib-py and uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "build>=1.2.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.14.0",
    "pip-audit>=2.8.0",
    "pip-licenses>=5.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linter, Formatter, Import Sorter, Complexity)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

exclude = [
    ".git",
    ".makelib",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C901",
    "UP",
    "S",
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

# ------------------------------------------------------------------------------
# Mypy Configuration (Strict Static Type Checking)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    ".makelib/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ------------------------------------------------------------------------------
# Bandit Security AST Scanner Configuration
# ------------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", ".makelib"]
skips = ["B101"]
